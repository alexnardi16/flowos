name: Deploy web

on:
  push:
    branches: ['main']

jobs:
  deploy_web:
    name: Deploy web
    type: deploy
    params:
      prod: true
    hooks:
      before_install_node_modules:
        - name: Regenerate npm lockfile from package.json
          run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
