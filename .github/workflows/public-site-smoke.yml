name: Public legal site smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/privacy-policy/**'
      - 'public/privacy-policy-static.html'
      - 'public/delete-account/**'
      - 'public/terms/**'
      - 'public/_redirects'
      - '.github/workflows/public-site-smoke.yml'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    name: Check public legal pages
    runs-on: ubuntu-latest
    steps:
      - name: Check public legal pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://getflowos.netlify.app'
          cache_bust="smoke=$(date +%s)"

          for route in /privacy-policy/ /delete-account/ /terms/; do
            echo "Checking ${base}${route}"
            body="/tmp/page-${route//\//_}.html"
            status=$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
              --output "$body" --write-out '%{http_code}' \
              "${base}${route}?${cache_bust}")
            test "$status" = '200'
            grep -qi 'FlowOS' "$body"
          done

          echo 'Public legal pages are reachable and served by FlowOS.'
