name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy/supabase'
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    name: Deploy database and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "${{ secrets.SUPABASE_PROJECT_REF }}" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "${{ secrets.SUPABASE_DB_PASSWORD }}" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          deploy_function() {
            local function_name="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              echo "Deploying ${function_name} (attempt ${attempt}/3)"
              if supabase functions deploy "${function_name}" --project-ref "${SUPABASE_PROJECT_REF}" --use-api "$@"; then
                echo "Successfully deployed ${function_name}"
                return 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: ${function_name} failed after 3 attempts" >&2
                return 1
              fi
              local delay=$((attempt * 10))
              echo "Deployment of ${function_name} failed; retrying in ${delay}s" >&2
              sleep "${delay}"
            done
          }

          deploy_function interpret-commitment
          deploy_function google-workspace
          deploy_function google-sync-guard
          deploy_function google-sync-worker --no-verify-jwt
          deploy_function google-push-webhook --no-verify-jwt
          deploy_function google-delete-item
          deploy_function delete-account

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all
