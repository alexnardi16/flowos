name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy/supabase'
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    name: Deploy database and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "${{ secrets.SUPABASE_PROJECT_REF }}" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "${{ secrets.SUPABASE_DB_PASSWORD }}" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy interpret-commitment --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
          supabase functions deploy google-workspace --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
          supabase functions deploy ai-planner --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api

      - name: Apply database migrations
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all

      - name: Confirm AI planner fallback
        run: echo "The AI planner uses OPENAI_API_KEY when configured server-side and falls back to deterministic suggestions otherwise."
