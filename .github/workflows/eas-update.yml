name: EAS Preview Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: FlowOS preview update

jobs:
  update:
    name: Publish preview OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        run: test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Authenticate with Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Expo authentication attempt ${attempt}/5"
            if eas whoami; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Authentication failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "Unable to authenticate with Expo after 5 attempts."
          exit 1

      - name: Validate project
        run: npm run typecheck

      - name: Publish update
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: eas update --channel preview --environment preview --message "${{ inputs.message }}" --non-interactive
