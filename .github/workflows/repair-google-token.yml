name: Repair Google token handling
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Patch OAuth and token refresh
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('lib/googleWorkspace.ts')
          s=p.read_text()
          old="queryParams:{access_type:'offline',include_granted_scopes:'true'}"
          new="queryParams:{access_type:'offline',prompt:'consent',include_granted_scopes:'true'}"
          if old not in s: raise SystemExit('OAuth query params not found')
          p.write_text(s.replace(old,new))
          p=Path('supabase/functions/google-workspace/index.ts')
          s=p.read_text()
          old='const next={...row,access_token:payload.access_token,expires_at:expiresAt(payload.expires_in),token_type:payload.token_type??row.token_type};await admin.schema("private").from("google_oauth_tokens").update({access_token:next.access_token,expires_at:next.expires_at,token_type:next.token_type,updated_at:now()}).eq("user_id",userId);return next;'
          new='const next={...row,access_token:payload.access_token,refresh_token:payload.refresh_token??row.refresh_token,expires_at:expiresAt(payload.expires_in),token_type:payload.token_type??row.token_type};await admin.schema("private").from("google_oauth_tokens").update({access_token:next.access_token,refresh_token:next.refresh_token,expires_at:next.expires_at,token_type:next.token_type,updated_at:now()}).eq("user_id",userId);return next;'
          if old not in s: raise SystemExit('google-workspace refresh block not found')
          p.write_text(s.replace(old,new))
          p=Path('supabase/functions/google-sync-guard/index.ts')
          s=p.read_text()
          old='const next={access_token:p.access_token,expires_at:new Date(Date.now()+Math.max(60,p.expires_in??3600)*1000).toISOString(),token_type:p.token_type??"Bearer"};await admin.schema("private").from("google_oauth_tokens").update({...next,updated_at:new Date().toISOString()}).eq("user_id",userId);return {...data,...next};'
          new='const next={access_token:p.access_token,refresh_token:p.refresh_token??data.refresh_token,expires_at:new Date(Date.now()+Math.max(60,p.expires_in??3600)*1000).toISOString(),token_type:p.token_type??"Bearer"};await admin.schema("private").from("google_oauth_tokens").update({...next,updated_at:new Date().toISOString()}).eq("user_id",userId);return {...data,...next};'
          if old not in s: raise SystemExit('sync-guard refresh block not found')
          p.write_text(s.replace(old,new))
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13
      - run: npm install --no-audit --no-fund && npm run typecheck
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/repair-google-token.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix: force Google consent and persist rotated refresh tokens'
          git push
