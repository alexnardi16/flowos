name: EAS Android Production Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: production-aab-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # The main-branch condition is a one-time smoke trigger used to verify the
    # local AAB path after the EAS cloud-build quota was exhausted. Normal main
    # pushes do not create production builds; tags/releases remain the normal triggers.
    if: github.event_name != 'push' || github.event.head_commit.message == 'ci: verify local production AAB build'
    name: Build Android production AAB locally
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx -y expo-doctor

      - name: Build production AAB locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AI_MODE: local-first
        run: |
          mkdir -p artifacts
          eas build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/artifacts/FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab"
          test -s "$GITHUB_WORKSPACE/artifacts/FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab"

      - name: Upload AAB workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-${{ github.event.release.tag_name || github.ref_name }}-AAB
          path: artifacts/FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab
          if-no-files-found: error

      - name: Upload AAB to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "artifacts/FlowOS-${TAG_NAME}.aab" --clobber
          else
            echo "No GitHub Release exists for $TAG_NAME yet; AAB is available as a workflow artifact."
          fi
