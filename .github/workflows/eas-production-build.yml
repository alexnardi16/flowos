name: EAS Android Production Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: production-aab-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android production AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx -y expo-doctor

      - name: Configure EAS production environment
        run: |
          eas env:create production --name EXPO_PUBLIC_SUPABASE_URL --value "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" --visibility plaintext --force --non-interactive
          eas env:create production --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY --value "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" --visibility sensitive --force --non-interactive
          eas env:create production --name EXPO_PUBLIC_AI_MODE --value "local-first" --visibility plaintext --force --non-interactive

      - name: Build production AAB
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AI_MODE: local-first
        run: eas build --platform android --profile production --non-interactive --wait --clear-cache --json > eas-build.json

      - name: Download AAB
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('No AAB download URL found in EAS response');
            console.error(JSON.stringify(build, null, 2));
            process.exit(1);
          }
          fs.writeFileSync('aab-url.txt', url);
          NODE
          curl --fail --location --retry 3 --output FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab "$(cat aab-url.txt)"
          test -s FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab

      - name: Upload AAB workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-${{ github.event.release.tag_name || github.ref_name }}-AAB
          path: FlowOS-${{ github.event.release.tag_name || github.ref_name }}.aab
          if-no-files-found: error

      - name: Upload AAB to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "FlowOS-${TAG_NAME}.aab" --clobber
          else
            echo "No GitHub Release exists for $TAG_NAME yet; AAB is available as a workflow artifact."
          fi
