name: Production Android AAB

on:
  push:
    tags: ['v*', '*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to build and update (for example v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

env:
  EAS_NO_VCS: '1'

jobs:
  build-aab:
    name: Build production AAB
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "aab_name=FlowOS-${TAG}.aab" >> "$GITHUB_OUTPUT"
          echo "Building release tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Regenerate npm lockfile from package.json
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check EAS secrets
        run: |
          test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Install EAS CLI
        shell: bash
        run: npm install --global eas-cli@latest

      - name: Validate EAS authentication
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Validating EAS authentication (attempt $attempt/5)"
            if eas whoami; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "EAS authentication check failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "EAS authentication could not be validated after 5 attempts"
          exit 1

      - name: Verify EAS production environment configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production EAS environment is managed persistently in EAS; no env:create mutation is performed during every build."
          echo "The Expo project must already contain EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY and EXPO_PUBLIC_AI_MODE in the production environment."

      - name: Build production AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json

      - name: Download AAB
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)
          ARTIFACT_URL=$(jq -r 'if type == "array" then .[0].artifacts.applicationArchiveUrl else .artifacts.applicationArchiveUrl end' eas-build.json)
          test -n "$BUILD_ID" && test "$BUILD_ID" != "null"
          test -n "$ARTIFACT_URL" && test "$ARTIFACT_URL" != "null"
          echo "EAS build: $BUILD_ID"
          echo "Downloading application archive directly from EAS artifact URL"
          curl --fail --location --retry 3 --retry-delay 2 --output "${{ steps.release.outputs.aab_name }}" "$ARTIFACT_URL"
          test -s "${{ steps.release.outputs.aab_name }}"
          file "${{ steps.release.outputs.aab_name }}"
          if ! unzip -t "${{ steps.release.outputs.aab_name }}" >/dev/null 2>&1; then
            echo "Downloaded artifact is not a valid ZIP/AAB archive"
            exit 1
          fi

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-AAB-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.aab_name }}
          if-no-files-found: error

      - name: Remove existing AAB assets from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          echo "Removing existing .aab assets from release $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith(".aab")) | .name' | while IFS= read -r ASSET; do
            if [ -n "$ASSET" ]; then
              echo "Deleting release asset: $ASSET"
              gh release delete-asset "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Attach definitive AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: ${{ steps.release.outputs.aab_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
