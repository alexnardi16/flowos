name: Production Android AAB

on:
  push:
    tags: ['v*', '*.*.*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    name: Build production AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Check EAS secrets
        run: |
          test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Configure EAS production environment
        run: |
          eas env:create production --name EXPO_PUBLIC_SUPABASE_URL --value "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" --visibility plaintext --force --non-interactive
          eas env:create production --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY --value "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" --visibility sensitive --force --non-interactive
          eas env:create production --name EXPO_PUBLIC_AI_MODE --value "local-first" --visibility plaintext --force --non-interactive
      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
      - name: Download AAB
        id: download
        run: |
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)
          test -n "$BUILD_ID" && test "$BUILD_ID" != "null"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          eas build:download --build-id "$BUILD_ID" --non-interactive
          AAB=$(find . -type f -name '*.aab' -print -quit)
          test -n "$AAB"
          cp "$AAB" "FlowOS-${GITHUB_SHA}.aab"
      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-AAB-${{ github.ref_name }}
          path: FlowOS-${{ github.sha }}.aab
          if-no-files-found: error
      - name: Attach AAB to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: FlowOS-${{ github.sha }}.aab
