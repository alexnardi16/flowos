name: Production Android AAB

on:
  push:
    tags: ['v*', '*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag for the GitHub Release and AAB name (for example v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      source_ref:
        description: 'Git ref to compile (branch, tag, or commit SHA). Use main for the corrected code.'
        required: true
        default: 'main'
        type: string
      version_code:
        description: 'Android versionCode for this production build (auto-incremented after each successful production AAB)'
        required: true
        default: '82'
        type: string

permissions:
  contents: write

jobs:
  build-aab:
    name: Build production AAB with GitHub Actions + Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main for production version metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            SOURCE_REF="${{ inputs.source_ref }}"
            REQUESTED_VERSION_CODE="${{ inputs.version_code }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            SOURCE_REF="$TAG"
            REQUESTED_VERSION_CODE=""
          else
            TAG="${GITHUB_REF_NAME}"
            SOURCE_REF="$TAG"
            REQUESTED_VERSION_CODE=""
          fi
          test -n "$TAG"
          test -n "$SOURCE_REF"

          LAST_VERSION_CODE="$(git show origin/main:.github/production-version-code 2>/dev/null || printf '81')"
          test "$LAST_VERSION_CODE" -ge 1

          if [ -n "$REQUESTED_VERSION_CODE" ] && [ "$REQUESTED_VERSION_CODE" -gt "$LAST_VERSION_CODE" ]; then
            VERSION_CODE="$REQUESTED_VERSION_CODE"
          else
            VERSION_CODE=$((LAST_VERSION_CODE + 1))
            if [ -n "$REQUESTED_VERSION_CODE" ]; then
              echo "Requested versionCode $REQUESTED_VERSION_CODE is not above the latest successful production versionCode $LAST_VERSION_CODE; using $VERSION_CODE instead."
            else
              echo "Auto-incrementing from latest successful production versionCode $LAST_VERSION_CODE to $VERSION_CODE."
            fi
          fi

          test "$VERSION_CODE" -ge 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "aab_name=FlowOS-$TAG.aab" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Source ref: $SOURCE_REF"
          echo "Android versionCode: $VERSION_CODE"

      - name: Show next production Android versionCode
        shell: bash
        run: |
          NEXT_VERSION_CODE=$(( ${{ steps.release.outputs.version_code }} + 1 ))
          echo "Next production Android versionCode after this build: $NEXT_VERSION_CODE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 0

      - name: Check required production secrets
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON" || (echo "Missing GitHub secret GOOGLE_SERVICES_JSON" && exit 1)
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing GitHub secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing GitHub secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEY_PASSWORD" && exit 1)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          test -s google-services.json

      - name: Stamp build identity and Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "EXPO_PUBLIC_FLOWOS_RELEASE_TAG=${{ steps.release.outputs.tag }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FLOWOS_COMMIT_SHA=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "FLOWOS_ANDROID_VERSION_CODE=${{ steps.release.outputs.version_code }}" >> "$GITHUB_ENV"
          cat > lib/generatedBuildInfo.ts <<EOF
          export const FLOWOS_BUILD = {
            releaseTag: '${{ steps.release.outputs.tag }}',
            commitSha: '$SOURCE_COMMIT',
          } as const;
          EOF
          echo "Build identity: release=${{ steps.release.outputs.tag }} commit=$SOURCE_COMMIT versionCode=${{ steps.release.outputs.version_code }}"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Restore production signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/flowos-production.keystore
          test -s android/flowos-production.keystore
          chmod 600 android/flowos-production.keystore

      - name: Inject production signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > android/ci-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          cat >> android/app/build.gradle <<'EOF'

          // Production signing is injected by GitHub Actions from encrypted secrets.
          apply from: "../ci-signing.gradle"
          EOF
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/flowos-production.keystore" >> "$GITHUB_ENV"

      - name: Build production AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Gradle's distribution server can occasionally return a transient 5xx/504.
          # Retry the wrapper so a temporary download outage does not fail the release.
          for attempt in 1 2 3 4 5; do
            echo "Gradle bundleRelease attempt $attempt/5"
            if ./gradlew bundleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Gradle build failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          echo "Gradle bundleRelease failed after 5 attempts"
          exit 1

      - name: Verify production AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB_SOURCE="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_SOURCE"
          mkdir -p artifacts
          cp "$AAB_SOURCE" "artifacts/${{ steps.release.outputs.aab_name }}"
          unzip -t "artifacts/${{ steps.release.outputs.aab_name }}" >/dev/null
          echo "Production AAB created successfully:"
          ls -lh "artifacts/${{ steps.release.outputs.aab_name }}"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-AAB-${{ steps.release.outputs.tag }}
          path: artifacts/${{ steps.release.outputs.aab_name }}
          if-no-files-found: error

      - name: Remove existing AAB assets from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          echo "Removing existing .aab assets from release $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith(".aab")) | .name' | while IFS= read -r ASSET; do
            if [ -n "$ASSET" ]; then
              echo "Deleting release asset: $ASSET"
              gh release delete-asset "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Attach definitive AAB to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          AAB="artifacts/${{ steps.release.outputs.aab_name }}"
          for attempt in 1 2 3 4 5; do
            echo "Uploading $(basename "$AAB") to GitHub Release $TAG (attempt $attempt/5)"
            if gh release upload "$TAG" "$AAB" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Release asset upload succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Release asset upload failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "Unable to upload the AAB to GitHub Release after 5 attempts"
          exit 1

      - name: Persist production versionCode and update workflow default
        if: success()
        env:
          FLOWOS_WORKFLOW_TOKEN: ${{ secrets.FLOWOS_WORKFLOW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLOWOS_WORKFLOW_TOKEN" || (echo "Missing GitHub secret FLOWOS_WORKFLOW_TOKEN" && exit 1)

          NEXT_VERSION_CODE=$(( ${{ steps.release.outputs.version_code }} + 1 ))
          export NEXT_VERSION_CODE
          git config user.name "FlowOS Release Automation"
          git config user.email "flowos-release-automation@users.noreply.github.com"

          GH_TOKEN="$FLOWOS_WORKFLOW_TOKEN" gh auth setup-git
          git fetch origin main
          git checkout -B main origin/main

          printf '%s\n' "${{ steps.release.outputs.version_code }}" > .github/production-version-code

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(".github/workflows/release-aab.yml")
          lines = path.read_text().splitlines()
          in_target = False
          replaced = False
          output = []
          for line in lines:
              if line.startswith("      version_code:"):
                  in_target = True
              elif in_target and line.startswith("        default:"):
                  output.append("        default: '" + os.environ["NEXT_VERSION_CODE"] + "'")
                  replaced = True
                  in_target = False
                  continue
              elif in_target and line.startswith("      ") and not line.startswith("        "):
                  in_target = False
              output.append(line)
          if not replaced:
              raise SystemExit("Could not locate workflow_dispatch version_code default")
          path.write_text("\n".join(output) + "\n")
          PY

          git add .github/production-version-code .github/workflows/release-aab.yml
          if git diff --cached --quiet; then
            echo "Production version state is already current."
            exit 0
          fi
          git commit -m "Advance production Android versionCode to $NEXT_VERSION_CODE"
          git push origin main
      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          rm -f android/flowos-production.keystore android/ci-signing.gradle google-services.json
