name: Final FlowOS repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'alexnardi16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm
      - name: Apply final repairs
        shell: python
        run: |
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              p.write_text(n)
              print(path, 'changed' if n != s else 'unchanged')

          edit('app/(tabs)/capture.tsx', lambda s: s if 'useLocalSearchParams' in s.split('\n')[:4] else s.replace("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useState } from 'react';\nimport { useLocalSearchParams } from 'expo-router';", 1))
          edit('lib/voiceCommands.ts', lambda s: s.replace("const values = result.extra?.['android.speech.extra.RESULTS'];", "const values = (result.extra as Record<string, unknown> | undefined)?.['android.speech.extra.RESULTS'];", 1))
          edit('widgets/android/TodayWidget.tsx', lambda s: s.replace("alignItems:'center', gap:5", "alignItems:'center'", 1))
          edit('widgets/android/CalendarWidget.tsx', lambda s: s.replace("alignItems:'center',gap:5", "alignItems:'center'", 1))
          edit('lib/dailySummary.ts', lambda s: s.replace("isTomorrow ? 'Mattina libera: nessun impegno pianificato.' : 'Giornata libera: nessun impegno pianificato.'", "isTomorrow ? 'Mattina libera.' : 'Giornata libera.'", 1))

          def me_fix(s):
              old = "{logs.length?logs.map(logLine).join('\\n'):'Nessun evento registrato.'}"
              new = "{`FlowOS ${Application.nativeApplicationVersion??'unknown'} · versionCode ${Application.nativeBuildVersion??'unknown'}\\n${logs.length?logs.map(logLine).join('\\n'):'Nessun evento registrato.'}`}"
              return s.replace(old, new, 1)
          edit('app/(tabs)/me.tsx', me_fix)

          def sync_fix(s):
              invoke_start = s.index('async function invoke(body:')
              invoke_end = s.index('async function invokeSyncGuard()', invoke_start)
              a, b = s[:invoke_start], s[invoke_start:invoke_end]
              b = b.replace("let lastError:unknown;for(let attempt=0;attempt<=retries;attempt++){", "let lastError:unknown;let responseStatus:number|null=null;for(let attempt=0;attempt<=retries;attempt++){", 1)
              b = b.replace("});const raw=await response.text();let payload:any=null;", "});responseStatus=response.status;const raw=await response.text();let payload:any=null;", 1)
              b = b.replace("const transient=isTransientNetworkError(message);", "const transient=(responseStatus!==null&&responseStatus>=500)||isTransientNetworkError(message);", 1)
              s = a + b + s[invoke_end:]

              guard_start = s.index('async function invokeSyncGuard()')
              guard_end = s.index('export async function signInWithGoogle()', guard_start)
              a, b = s[:guard_start], s[guard_start:guard_end]
              b = b.replace("let lastError:unknown;for(let attempt=0;attempt<=MAX_NETWORK_RETRIES;attempt++){", "let lastError:unknown;let guardResponseStatus:number|null=null;for(let attempt=0;attempt<=MAX_NETWORK_RETRIES;attempt++){", 1)
              b = b.replace("});const raw=await response.text();let payload:any=null;", "});guardResponseStatus=response.status;const raw=await response.text();let payload:any=null;", 1)
              b = b.replace("recordDiagnostic('google-sync-guard-request-failed',{attempt:attempt+1,message,transient:isTransientNetworkError(message)},'error');if(attempt>=MAX_NETWORK_RETRIES||!isTransientNetworkError(message))break;", "const transient=(guardResponseStatus!==null&&guardResponseStatus>=500)||isTransientNetworkError(message);recordDiagnostic('google-sync-guard-request-failed',{attempt:attempt+1,message,transient},'error');if(attempt>=MAX_NETWORK_RETRIES||!transient)break;", 1)
              return a + b + s[guard_end:]
          edit('lib/googleWorkspace.ts', sync_fix)

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck before commit
        run: npm run typecheck
      - name: Remove repair workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/repair-flowos-once.yml .github/workflows/repair-flowos-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Google sync diagnostics and voice UI"
          git push origin HEAD:main
