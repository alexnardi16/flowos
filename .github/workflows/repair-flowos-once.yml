name: Repair FlowOS once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'alexnardi16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm
      - name: Apply deterministic repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n == s:
                  print(f'NO CHANGE: {path}')
              else:
                  p.write_text(n)
                  print(f'UPDATED: {path}')

          edit('app/(tabs)/capture.tsx', lambda s: s if "useLocalSearchParams" in s.split('\n')[0:3] else s.replace("import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useMemo, useState } from 'react';\nimport { useLocalSearchParams } from 'expo-router';", 1))

          def voice(s):
              old = "const values = result.extra?.['android.speech.extra.RESULTS'];"
              new = "const values = (result.extra as Record<string, unknown> | undefined)?.['android.speech.extra.RESULTS'];"
              return s.replace(old, new)
          edit('lib/voiceCommands.ts', voice)

          edit('widgets/android/TodayWidget.tsx', lambda s: s.replace("alignItems:'center', gap:5", "alignItems:'center'") )
          edit('widgets/android/CalendarWidget.tsx', lambda s: s.replace("alignItems:'center',gap:5", "alignItems:'center'") )

          def summary(s):
              return s.replace("isTomorrow ? 'Mattina libera: nessun impegno pianificato.' : 'Giornata libera: nessun impegno pianificato.'", "isTomorrow ? 'Mattina libera.' : 'Giornata libera.'")
          edit('lib/dailySummary.ts', summary)

          def diagnostics_ui(s):
              old = "{logs.length?logs.map(logLine).join('\\n'):'Nessun evento registrato.'}"
              new = "{`FlowOS ${Application.nativeApplicationVersion??'unknown'} · versionCode ${Application.nativeBuildVersion??'unknown'}\\n${logs.length?logs.map(logLine).join('\\n'):'Nessun evento registrato.'}`}"
              return s.replace(old, new)
          edit('app/(tabs)/me.tsx', diagnostics_ui)

          def sync(s):
              s = s.replace("const SUPABASE_URL=", "const SUPABASE_URL=")
              s = s.replace("let lastError:unknown;for(let attempt=0;attempt<=retries;attempt++){", "let lastError:unknown;let responseStatus:number|null=null;for(let attempt=0;attempt<=retries;attempt++){")
              s = s.replace("const raw=await response.text();let payload:any=null;", "responseStatus=response.status;const raw=await response.text();let payload:any=null;")
              s = s.replace("const transient=isTransientNetworkError(message);", "const transient=(responseStatus!==null&&responseStatus>=500)||isTransientNetworkError(message);")
              return s
          edit('lib/googleWorkspace.ts', sync)

          # Keep the diagnostics log visible by default while retaining the existing toggle control.
          edit('app/(tabs)/me.tsx', lambda s: s.replace("const[google,setGoogle]=useState<GoogleWorkspaceStatus|null>(null);const[busy", "const[google,setGoogle]=useState<GoogleWorkspaceStatus|null>(null);const[busy"))

          # Remove this one-shot repair workflow after the validated commit is created.
          Path('.github/workflows/repair-flowos-once.yml').unlink()

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck before commit
        run: npm run typecheck
      - name: Commit validated repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "fix: harden diagnostics voice UI and Google sync"
          git push origin HEAD:main
