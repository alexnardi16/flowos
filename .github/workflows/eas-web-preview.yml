name: EAS Web Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/eas-web-preview.yml"

jobs:
  deploy:
    name: Export and deploy FlowOS web preview
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          test -n "${{ secrets.EXPO_TOKEN }}" || (echo "Missing EXPO_TOKEN" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo web dependencies
        run: npx expo install react-native-web @expo/metro-runtime

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Export web application
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AI_MODE: local-first
        run: npx expo export --platform web

      - name: Deploy private preview to EAS Hosting
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AI_MODE: local-first
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            echo "EAS Hosting deployment attempt ${attempt}/4"
            if eas deploy --alias flowos-private --environment preview --non-interactive; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Deployment failed, likely while EAS Hosting storage is being provisioned. Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "EAS Hosting deployment still failed after 4 attempts."
          echo "Open the FlowOS project in expo.dev, enter Hosting, and activate Hosting or choose the initial preview subdomain if prompted; then rerun this workflow."
          exit 1

# Deployment trigger: 8-digit OTP support
