name: Android Preview Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-build.yml"
      - "eas.json"
      - "app.config.js"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "plugins/**"
      - "providers/**"
      - "widgets/**"

concurrency:
  group: flowos-android-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK (GitHub Actions + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secret
        run: |
          test -n "${{ secrets.GOOGLE_SERVICES_JSON }}" || (echo "Missing GitHub secret GOOGLE_SERVICES_JSON" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          test -s google-services.json

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK with dependency-resolution retries
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Gradle assembleDebug attempt $attempt/5"
            if ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Gradle dependency/build resolution failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          echo "Gradle assembleDebug failed after 5 attempts"
          exit 1

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
